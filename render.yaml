
services:
  - type: web
    name: damask-shop
    env: node
    buildCommand: npm install && npm run build && node migrations/run.js && node migrations/seed.js
    startCommand: NODE_ENV=production node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: damask-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: damask-db
    databaseName: damask
    plan: free
    postgresMajorVersion: 15
