services:
  - type: web
    name: damask-shop
    runtime: node
    buildCommand: npm install --include=dev && npm run build && node migrations/run.js && node migrations/seed.js
    startCommand: NODE_ENV=production node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: damask-db
          property: connectionString
    headers:
      - source: "**/*"
        headers:
          - key: Cache-Control
            value: "public, max-age=86400"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: damask-db
    databaseName: damask
    user: damask_user
    postgresMajorVersion: 15