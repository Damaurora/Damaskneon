services:
  - type: web
    name: damask-shop
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/public
    headers:
      - source: "**/*"
        headers:
          - key: Cache-Control
            value: "public, max-age=86400"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production

databases:
  - name: damask-db
    databaseName: damask
    user: damask_user
    postgresMajorVersion: 15

jobs:
  - name: migration
    buildCommand: npm install
    startCommand: node migrations/run.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: damask-db
          property: connectionString
      - key: NODE_ENV
        value: production

  - name: seed
    buildCommand: npm install
    startCommand: node migrations/seed.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: damask-db
          property: connectionString
      - key: NODE_ENV
        value: production